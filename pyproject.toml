[project]
name = "portfolio-tracker"
version = "0.1.0"
description = "Personal investment portfolio tracker with real risk analytics"
requires-python = ">=3.11"

# core/ needs numpy and pandas for the risk mathematics and nothing else.
# streamlit appears only under [app]: core must import without it.
dependencies = ["numpy>=1.26", "pandas>=2.2"]

[project.optional-dependencies]
# The test suite must run with these alone -- no streamlit, no network client.
test = ["pytest>=8.0"]
app = ["streamlit>=1.36", "altair>=5.0"]
# yfinance is not optional to this extra: YahooProvider imports it directly, so
# installing `data` without it produces an application that cannot fetch a
# single price. requests alone was never enough.
data = ["requests>=2.31", "yfinance>=0.2.40"]

# Without this, a flat-layout clone fails to install: setuptools finds both
# `portfolio` and `spike` at the top level and refuses to guess. `spike/` is
# throwaway validation scripts and is deliberately not packaged.
[tool.setuptools.packages.find]
include = ["portfolio*"]

[tool.pytest.ini_options]
testpaths = ["portfolio/tests", "portfolio/core"]
addopts = "-q --doctest-modules --doctest-ignore-import-errors"
