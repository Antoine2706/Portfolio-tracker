name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The architectural constraint, enforced by the environment rather than by
    # a test that could pass on a machine which happens to have the app extra.
    name: core tests without the app or network extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core only
        run: pip install -e ".[test]"
      - name: Confirm the UI and network libraries really are absent
        run: |
          python - <<'PY'
          import importlib.util as u
          for module in ("fastapi", "starlette", "pydantic", "yfinance", "requests", "streamlit"):
              assert u.find_spec(module) is None, f"{module} must not be installed here"
          print("clean: no web framework, no network client")
          PY
      - name: Run the suite (API tests skip themselves without fastapi)
        run: pytest

      # The backtest harness is only worth having if it discriminates, and
      # that is a property of the running code rather than of any one test.
      # This fails the build if the no-skill control starts showing an edge,
      # if the known injected edge stops being recovered, or if the
      # look-ahead canary goes quiet.
      - name: The harness must still discriminate
        run: portfolio controls --quick

  install:
    # A clean clone must install and launch, offline. The fixture provider
    # means this job proves the application, not the runner's network.
    name: clean clone installs, launches and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exactly as the README instructs
        run: pip install -e ".[app,data,test]"
      - name: Every declared provider dependency is importable
        run: |
          python - <<'PY'
          import yfinance, fastapi, uvicorn, openpyxl, requests
          from portfolio.data.providers.yahoo import YahooProvider
          from portfolio.data.providers.openfigi import OpenFIGIProvider
          # Not a network call: this only proves the library is present, which
          # is the failure a fresh install actually hit.
          YahooProvider()._ticker("AAPL")
          print("providers import and can construct their clients")
          PY
      - name: Full suite, API tests included
        run: pytest
      - name: Launch offline and check it answers
        run: |
          portfolio serve --provider fixture --no-browser --port 8765 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8765/api/health > /dev/null; then
              echo "app is serving"
              curl -sf http://127.0.0.1:8765/api/snapshot | python -c 'import json,sys; s=json.load(sys.stdin); print(len(s["holdings"]), "holdings,", "risk available:", s["risk"]["available"]); assert s["risk"]["available"]'
              curl -sf http://127.0.0.1:8765/ | grep -q "<title>" && echo "client is served"
              exit 0
            fi
            sleep 2
          done
          echo "app failed to start"; exit 1
